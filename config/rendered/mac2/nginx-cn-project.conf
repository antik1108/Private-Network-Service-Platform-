# nginx edge - reverse proxy, TLS termination and load balancer for teamX.test
# Role: edge1-mac2 on 10.7.31.150
#
# Rendered by scripts/render-configs.sh from team/team.env and installed at
# /opt/homebrew/etc/nginx/servers/cn-project.conf (Homebrew's nginx.conf
# includes servers/*). The primary edge (Mac 2) and the standby edge
# (Mac 3/4, Extension E) run this same file; only the X-Edge label differs.

# Access log that records which backend handled each request and whether
# nginx had to retry - this is the evidence for Extension D.
log_format cn_edge '$remote_addr [$time_local] "$request" status=$status '
                   'edge=edge1-mac2 upstream=$upstream_addr '
                   'upstream_status=$upstream_status rt=$upstream_response_time';

upstream backend_pool {
    # Default strategy: round-robin (A, B, A, B, ...).
    #
    # Health detection (Extension D) - open-source nginx uses passive checks:
    #  * a failed connect/timeout counts as a failure;
    #  * after max_fails=1 failure the server is marked down for
    #    fail_timeout=10s and receives no traffic;
    #  * after 10s nginx probes it again with one real request; if that works
    #    it rejoins the rotation automatically.
    server 192.168.1.188:3001 max_fails=1 fail_timeout=10s;   # Backend A
    server 192.168.1.188:3002 max_fails=1 fail_timeout=10s;   # Backend B
}

# Port 80: redirect everything to HTTPS.
server {
    listen 80;
    server_name app.teamX.test api.teamX.test;
    return 301 https://$host$request_uri;
}

server {
    # "listen 443" with no address = wildcard bind, which macOS allows
    # without root. Use 8443 here if your Mac refuses 443.
    listen 443 ssl;
    http2 on;
    server_name app.teamX.test api.teamX.test;

    ssl_certificate     /Users/vansh/cn-project/tls/app.teamX.test.crt;
    ssl_certificate_key /Users/vansh/cn-project/tls/app.teamX.test.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:cn_tls:1m;

    access_log /Users/vansh/cn-project/logs/nginx-access.log cn_edge;
    error_log  /Users/vansh/cn-project/logs/nginx-error.log warn;

    # Which edge answered (Extension E cutover evidence). Backend IPs are NOT
    # exposed to clients; they only appear in the edge's own log.
    add_header X-Edge edge1-mac2 always;

    # Edge liveness check that does not touch the backends.
    location = /edge-health {
        default_type text/plain;
        return 200 "edge edge1-mac2 ok\n";
    }

    location / {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fail fast so a dead backend costs ~ms, not seconds.
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;

        # If a backend refuses / times out / returns a gateway error, retry
        # the SAME request on the other backend, so the client never sees it.
        proxy_next_upstream       error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
